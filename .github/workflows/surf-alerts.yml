name: surf-alerts

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Skip sending notifications"
        type: boolean
        default: false

concurrency:
  group: surf-alerts
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run surf checker
        env:
          AGENTMAIL_API_KEY:  ${{ secrets.AGENTMAIL_API_KEY }}
          AGENTMAIL_INBOX_ID: ${{ secrets.AGENTMAIL_INBOX_ID }}
          NTFY_TOPIC:         ${{ secrets.NTFY_TOPIC }}
          ALERT_TO:           ${{ vars.ALERT_TO }}
          DRY_RUN:            ${{ inputs.dry_run && '1' || '' }}
        run: python scripts/check_surf.py

      - name: Commit state + data
        run: |
          if [[ -z "$(git status --porcelain state.json docs/data.json docs/spots)" ]]; then
            echo "no changes"
            exit 0
          fi
          git config user.name  "surf-alerts-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state.json docs/data.json docs/spots
          git commit -m "tick: $(date -u +%FT%TZ)"

          # Retry push under races: if a concurrent run pushed first, rebase
          # our tick commit on top and try again. Up to 5 attempts.
          for i in 1 2 3 4 5; do
            if git push; then
              echo "push succeeded on attempt $i"
              exit 0
            fi
            echo "push failed on attempt $i, rebasing on origin/main"
            git fetch origin main
            git rebase origin/main || { git rebase --abort; exit 1; }
          done
          echo "gave up after 5 push attempts" >&2
          exit 1
