<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Should We Surf?</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="alternate icon" href="favicon.svg">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Original+Surfer&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="app.css">
</head>

<body>
  <!-- Decorative animated ocean. aria-hidden because content is purely visual. -->
  <iframe id="oceanFrame" src="3d-ocean/simulation.html" title="" aria-hidden="true" tabindex="-1" loading="eager"></iframe>
  <div class="veil" aria-hidden="true"></div>

  <main class="wrap">
    <header class="header">
      <div class="brand">
        <div class="name">
          <svg class="pixel-surfer" viewBox="0 0 22 16" shape-rendering="crispEdges" aria-hidden="true">
            <!-- Wave spray behind (upper-left) -->
            <rect x="0"  y="3" width="2" height="1" fill="#fff"/>
            <rect x="1"  y="4" width="3" height="1" fill="#fff"/>
            <rect x="0"  y="5" width="5" height="1" fill="#e6f1f7"/>
            <rect x="2"  y="6" width="5" height="1" fill="#cfe2ed"/>
            <rect x="3"  y="7" width="4" height="1" fill="#b3d9e8"/>
            <rect x="0"  y="8" width="3" height="1" fill="#7fb3cf"/>
            <rect x="2"  y="9" width="5" height="1" fill="#5b9bbe"/>

            <!-- Hair (back of head + top) -->
            <rect x="11" y="0" width="3" height="1" fill="#1f1a17"/>
            <rect x="10" y="1" width="5" height="1" fill="#1f1a17"/>
            <rect x="10" y="2" width="3" height="1" fill="#1f1a17"/>

            <!-- Face / head (facing right) -->
            <rect x="13" y="2" width="2" height="1" fill="#f5d3a6"/>
            <rect x="12" y="3" width="3" height="1" fill="#f5d3a6"/>
            <rect x="14" y="3" width="1" height="1" fill="#1f1a17"/> <!-- eye/sunglasses hint -->
            <rect x="12" y="4" width="2" height="1" fill="#f5d3a6"/>

            <!-- Back arm (going up-left, balance) -->
            <rect x="9"  y="4" width="3" height="1" fill="#f5d3a6"/>
            <rect x="7"  y="5" width="3" height="1" fill="#f5d3a6"/>

            <!-- Torso (shirtless, tan) -->
            <rect x="11" y="5" width="3" height="1" fill="#f5d3a6"/>
            <rect x="11" y="6" width="3" height="1" fill="#f5d3a6"/>
            <rect x="14" y="5" width="1" height="1" fill="#d9a674"/>  <!-- side shading -->
            <rect x="14" y="6" width="1" height="1" fill="#d9a674"/>

            <!-- Front arm (reaching forward-right) -->
            <rect x="14" y="6" width="3" height="1" fill="#f5d3a6"/>
            <rect x="16" y="7" width="2" height="1" fill="#f5d3a6"/>

            <!-- Shorts (red) -->
            <rect x="10" y="7" width="5" height="1" fill="#d63148"/>
            <rect x="9"  y="8" width="6" height="1" fill="#d63148"/>
            <rect x="14" y="8" width="1" height="1" fill="#9b1f33"/>  <!-- shadow under -->

            <!-- Legs — wide stance, bent knees -->
            <rect x="9"  y="9"  width="2" height="1" fill="#f5d3a6"/>  <!-- back thigh -->
            <rect x="13" y="9"  width="2" height="1" fill="#f5d3a6"/>  <!-- front thigh -->
            <rect x="8"  y="10" width="2" height="1" fill="#f5d3a6"/>  <!-- back calf out -->
            <rect x="14" y="10" width="2" height="1" fill="#f5d3a6"/>  <!-- front calf out -->
            <rect x="7"  y="11" width="2" height="1" fill="#f5d3a6"/>  <!-- back foot -->
            <rect x="15" y="11" width="2" height="1" fill="#f5d3a6"/>  <!-- front foot -->

            <!-- Surfboard -->
            <rect x="5"  y="12" width="14" height="1" fill="#ffffff"/>
            <rect x="6"  y="13" width="12" height="1" fill="#d6dde2"/>

            <!-- Wave breaking under board (right side, splash) -->
            <rect x="18" y="12" width="1" height="1" fill="#cfe2ed"/>
            <rect x="19" y="13" width="2" height="1" fill="#b3d9e8"/>
            <rect x="4"  y="13" width="1" height="1" fill="#e6f1f7"/>
            <rect x="3"  y="14" width="3" height="1" fill="#7fb3cf"/>
            <rect x="17" y="14" width="4" height="1" fill="#5b9bbe"/>
            <rect x="6"  y="15" width="10" height="1" fill="#5b9bbe"/>
          </svg>
          <span class="sr-only">Should We Surf?</span>
        </div>
      </div>
    </header>

    <section class="grid cols-3" id="spotGrid" aria-label="Surf spots" aria-busy="true">
      <div class="fineprint" style="grid-column:1/-1;">Loading spots…</div>
    </section>

    <div class="btnrow">
      <div class="fineprint" style="margin-left:auto;" aria-live="polite">
        Last fetch: <span id="lastFetch">—</span> · Live ocean → <span id="legendVis">syncing…</span>
      </div>
    </div>
  </main>

  <div id="globalDay" title="Daylight">
    <span class="emoji">⌛</span><span>—</span>
  </div>

  <div class="footnote">
    Heights shown as estimated surfable face (offshore swell × period factor).
    3D ocean by <a href="https://github.com/Seth-arc/3D-Ocean" target="_blank" rel="noopener">Seth-arc</a>.
  </div>

  <script>
    const el = (id) => document.getElementById(id);

    /* --------------- 3D ocean control bridge --------------------------------- */
    const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));

    function liveToOceanParams(nowcast, forecast){
      const fc = forecast?.next_window;
      const wvht_ft = (nowcast?.wvht_ft) ?? (fc?.peak_swell_ft) ?? 1.0;
      const dpd_s   = (nowcast?.dpd_s)   ?? (fc?.peak_period_s) ?? 6.0;
      const wind_kt = (nowcast?.wind_speed_kt) ?? (fc?.peak_wind_kt) ?? 5.0;

      // Mappings tuned so each parameter has visible effect:
      // - waveHeight → 'size' uniform (clearly visible). 0.5ft→0.2, 3ft→0.9, 6ft→1.7, 10ft+→2.0
      // - waveSpeed → animation time multiplier. Short period = faster animation.
      //   DPD 4s→2.5, 7s→1.6, 10s→1.0, 14s→0.6.
      // - waveLength → distortion scale (subtle, but adds detail). Kept moderate so
      //   wind dominates the chop knob.
      // - windStrength → wind-driven chop. 0kt→0 (glassy), 15kt→0.6, 25kt+→1.0
      return {
        waveHeight:   clamp(0.18 + wvht_ft * 0.20, 0.1, 2.0),
        waveSpeed:    clamp(3.6 - dpd_s * 0.22,    0.3, 3.0),
        waveLength:   clamp(dpd_s * 3,             10,  80),
        windStrength: clamp(wind_kt / 25,          0.0, 1.0),
      };
    }

    function setOceanParams(params){
      const doc = el('oceanFrame').contentDocument;
      if(!doc) return false;
      let any = false;
      for(const [id, value] of Object.entries(params)){
        const input = doc.getElementById(id);
        if(!input) continue;
        input.value = String(value);
        input.dispatchEvent(new Event('input', { bubbles: true }));
        any = true;
      }
      return any;
    }

    function describeOcean(p){
      return `swell ${p.waveHeight.toFixed(2)} · chop ${p.waveSpeed.toFixed(2)} · λ ${p.waveLength.toFixed(0)} · wind ${p.windStrength.toFixed(2)}`;
    }

    let _lastParams = null;
    function pushOcean(){
      if(!_lastParams) return;
      const ok = setOceanParams(_lastParams);
      if(!ok){ setTimeout(pushOcean, 400); return; }
      el('legendVis').textContent = describeOcean(_lastParams);
    }
    el('oceanFrame').addEventListener('load', () => setTimeout(pushOcean, 200));
    /* ------------------------------------------------------------------------- */

    function fmtTime(d){
      try { return d.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'}); }
      catch { return d.toISOString(); }
    }

    const SPOTS = [
      { slug: 'ocean-mist',   name: 'Ocean Mist',        sub: 'Matunuck, RI' },
      { slug: 'narragansett', name: 'Narragansett',      sub: 'Town Beach, RI' },
      { slug: 'sachuest',     name: 'Second Beach',      sub: 'Sachuest · Middletown' },
      { slug: 'long-sands',   name: 'Long Sands Beach',  sub: 'York, ME' },
      { slug: 'hampton',      name: 'Hampton Beach',     sub: 'Hampton, NH' },
      { slug: 'nauset',       name: 'Nauset Beach',      sub: 'Orleans, MA' },
      { slug: 'long-beach',   name: 'Long Beach',        sub: 'Long Island, NY' },
      { slug: 'rockaway',     name: 'Rockaway Beach',    sub: 'Queens, NY' },
      { slug: 'manasquan',    name: 'Manasquan',         sub: 'Manasquan, NJ' },
      { slug: 'popham',       name: 'Popham Beach',      sub: 'Phippsburg, ME' },
    ];

    function renderSpotCard(spot, data){
      const card = document.createElement('a');
      card.className = 'card spot-card';
      card.href = `spots/${spot.slug}/`;
      card.dataset.card = spot.slug;

      if(!data){
        card.setAttribute('aria-label', `${spot.name}, ${spot.sub} — no data yet`);
        card.innerHTML = `
          <h2 class="spot-name">${spot.name}</h2>
          <div class="spot-sub">${spot.sub}</div>
          <div class="fineprint">No data yet.</div>`;
        return card;
      }

      const n = data.now || {};
      const sk = n.skill || null;
      const face = n.face_ft;
      const period = n.period_s;
      const swell = n.swell_ft;
      const wind = n.wind_speed_kt;
      const windDir = n.wind_dir || '';
      const sp = data.spot || {};

      const name = sp.name || spot.name;
      const sub = sp.subtitle || spot.sub;

      // Short label for the corner pill (full friendly text lives in the tooltip).
      const LEVEL_LABELS = {
        'out-of-range': 'Out of range',
        'worked':       'Worked',
        'manageable':   'Manageable',
        'marginal':     'Mushy',
        'flat':         'Flat',
        'unknown':      '—',
      };
      const levelShort = sk ? (LEVEL_LABELS[sk.level] || sk.level) : '';
      const tooltip = sk
        ? `${sk.label}${sk.note ? ' — ' + sk.note : ''}`
        : '';
      const cornerPill = sk ? `<div class="pill-big sm corner-pill skill-${sk.level}"
          role="img" aria-label="Beginner read: ${sk.label}. ${sk.note || ''}"
          title="${tooltip.replace(/"/g, '&quot;')}">
          <span class="emoji" aria-hidden="true">${sk.emoji}</span>
          <span>${levelShort}</span></div>` : '';

      // Aria-label gives screen readers a complete summary up front.
      const summary = [
        `${name}, ${sub}`,
        face != null ? `${face} foot face` : null,
        period != null ? `${period} second period` : null,
        wind != null ? `wind ${wind} knots ${windDir}` : null,
        sk ? `beginner read: ${sk.label}. ${sk.note || ''}` : null,
      ].filter(Boolean).join(', ');
      card.setAttribute('aria-label', summary);

      card.innerHTML = `
        ${cornerPill}
        <h2 class="spot-name">${name}</h2>
        <div class="spot-sub">${sub}</div>
        <div style="margin-top:8px;" aria-hidden="true">
          <span class="big">${face ?? '—'}</span><span class="unit">ft face</span>
          <span style="margin-left:12px; font-size:20px; font-weight:900;">${period ?? '—'} s</span>
        </div>
        <div class="row" aria-hidden="true">
          <div class="stat"><div class="k">Swell</div><div class="v">${swell ?? '—'} ft</div></div>
          <div class="stat"><div class="k">Wind</div><div class="v">${wind ?? '—'} kt ${windDir}</div></div>
        </div>`;
      return card;
    }

    async function loadSpot(slug){
      try {
        const res = await fetch(`spots/${slug}.json?ts=${Date.now()}`, { cache: 'no-store' });
        if(!res.ok) throw new Error(`${slug}.json ${res.status}`);
        return await res.json();
      } catch(err){
        console.error(slug, err);
        return null;
      }
    }

    async function load(){
      try {
        const results = await Promise.all(SPOTS.map(s => loadSpot(s.slug)));
        const grid = el('spotGrid');
        grid.innerHTML = '';
        for(let i=0; i<SPOTS.length; i++){
          grid.appendChild(renderSpotCard(SPOTS[i], results[i]));
        }
        grid.setAttribute('aria-busy', 'false');

        const primary = results[0];
        if(primary){
          el('lastFetch').textContent = fmtTime(new Date(primary.fetched_at));
          const n = primary.now;
          if(n){
            _lastParams = liveToOceanParams(
              { wvht_ft: n.swell_ft, dpd_s: n.period_s, wind_speed_kt: n.wind_speed_kt },
              primary.forecast,
            );
            pushOcean();
          }
          const dl = primary.daylight;
          if(dl){
            const g = el('globalDay');
            g.className = 'day-' + dl.status;
            const sub = dl.sunrise_local && dl.sunset_local
              ? `<span class="sub">↑${dl.sunrise_local} ↓${dl.sunset_local}</span>` : '';
            g.innerHTML = `<span class="emoji">${dl.emoji}</span><span>${dl.label}</span>${sub}`;
            g.title = dl.note || '';
          }
        }
      } catch (err) {
        console.error(err);
      }
    }

    window.addEventListener('load', load);
    document.addEventListener('visibilitychange', () => {
      if(document.visibilityState === 'visible') load();
    });

  </script>
</body>
</html>
