<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Should We Surf?</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="alternate icon" href="favicon.svg">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Original+Surfer&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root{
      --ink:#0b0b10;
      --paper:rgba(255,255,255,.78);
      --muted:rgba(0,0,0,.62);
      --ok:#1a7f37;
      --bad:#e11d48;
      --stroke:rgba(255,255,255,.35);
      --glass: rgba(255,255,255,.22);
      --glass-strong: rgba(255,255,255,.34);
    }

    html,body{ height:100%; }
    body{
      margin:0;
      color:#fff;
      font-family: "Space Grotesk", ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
      font-feature-settings: "tnum" 1, "ss01" 1;
      background:#0a1e2e;  /* fallback while iframe loads */
      overflow-x:hidden;
      min-height:100vh;
    }

    /* Full-bleed 3D ocean background */
    #oceanFrame{
      position:fixed;
      inset:0;
      width:100vw;
      height:100vh;
      border:0;
      z-index:0;
      pointer-events:none;
    }

    /* Soft vignette + slight darkening for content legibility */
    .veil{
      position:fixed; inset:0; pointer-events:none; z-index:1;
      background:
        radial-gradient(120% 80% at 50% 10%, rgba(0,0,0,0) 0%, rgba(0,0,0,.35) 80%),
        linear-gradient(180deg, rgba(0,0,0,.20) 0%, rgba(0,0,0,0) 30%, rgba(0,0,0,.35) 100%);
    }

    .wrap{
      position:relative;
      z-index:2;
      min-height:100vh;
      display:flex; flex-direction:column;
      padding:24px 16px;
      gap:18px;
    }

    /* ---------- Header / brand (no container — floats on ocean) -------- */
    .header{
      display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between;
      gap:14px;
    }
    .brand{ display:flex; flex-direction:column; gap:4px; }
    .brand .name{
      font-family: "Original Surfer", cursive;
      font-weight:400; letter-spacing:0; font-size:42px; line-height:1;
      text-shadow: 0 2px 12px rgba(0,0,0,.55), 0 1px 0 rgba(0,0,0,.4);
      display:flex; align-items:center; gap:12px;
      white-space: nowrap;
    }
    .brand .name .pixel-surfer{
      width: 1.5em; height: 1.1em; flex:0 0 auto;
      image-rendering: pixelated;
      filter: drop-shadow(0 2px 0 rgba(0,0,0,.45));
      animation: surfer-bob 2.2s ease-in-out infinite;
      transform-origin: 50% 70%;
    }
    @keyframes surfer-bob{
      0%,100% { transform: translateY(0)    rotate(0deg); }
      25%     { transform: translateY(-1px) rotate(-1deg); }
      50%     { transform: translateY(0)    rotate(0deg); }
      75%     { transform: translateY(-1px) rotate(1deg); }
    }
    @media (prefers-reduced-motion: reduce){
      .brand .name .pixel-surfer{ animation: none; }
    }
    .header-controls{
      display:flex; gap:10px; align-items:center; flex-wrap:wrap;
    }
    .pill{
      display:inline-flex; align-items:center; gap:10px; padding:10px 14px;
      border-radius:999px;
      background:var(--glass);
      border:1px solid var(--stroke);
      color:#fff;
      font-weight:600; text-transform:uppercase; letter-spacing:.05em; font-size:12px;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
    }

    /* Mobile: shrink title + give pill/button distinct styling */
    @media (max-width: 860px){
      .brand .name{ font-size: 30px; gap:8px; }
    }
    @media (max-width: 420px){
      .brand .name{ font-size: 24px; gap:6px; }
    }

    /* ---------- Cards (glass) ----------------------------------------- */
    .grid{
      display:grid; grid-template-columns:repeat(3, 1fr); gap:16px;
    }
    @media (max-width: 1100px){ .grid{ grid-template-columns:1fr 1fr; } }
    @media (max-width: 720px){ .grid{ grid-template-columns:1fr; } }

    .card{
      border-radius:18px;
      background:var(--glass);
      border:1px solid var(--stroke);
      padding:18px;
      box-shadow: 0 10px 30px rgba(0,0,0,.30);
      backdrop-filter: blur(14px) saturate(140%);
      -webkit-backdrop-filter: blur(14px) saturate(140%);
      color:#fff;
      transition: padding .2s ease;
    }
    .label{
      font-weight:900; text-transform:uppercase; letter-spacing:.10em;
      font-size:11px; color:rgba(255,255,255,.75); margin-bottom:10px;
    }
    /* Collapsible cards — label becomes the toggle */
    .card .label{
      display:flex; align-items:center; justify-content:space-between;
      cursor:pointer; user-select:none; gap:10px;
    }
    .card .label .chev{
      display:inline-block; transition:transform .25s ease;
      opacity:.7; font-size:14px;
    }
    .card.collapsed{ padding:14px 18px; }
    .card.collapsed .label{ margin-bottom:0; }
    .card.collapsed .label .chev{ transform:rotate(-90deg); }
    .card .body{
      overflow: visible;
      transition: max-height .3s ease, opacity .25s ease, margin-top .25s ease;
      max-height: 2000px; opacity:1;
    }
    .card.collapsed .body{
      max-height:0; opacity:0; margin-top:0; pointer-events:none;
      overflow: hidden;
    }
    .toggle-all{
      display:none; align-items:center; gap:8px;
      padding:10px 14px; border-radius:14px;
      /* solid accent so it reads as an actionable button, not a data badge */
      background:#ffd166; border:1px solid rgba(0,0,0,.25);
      color:#0b0b10; font-weight:700; text-transform:uppercase;
      letter-spacing:.04em; font-size:12px; cursor:pointer;
      box-shadow: 0 4px 14px rgba(0,0,0,.35);
    }
    .toggle-all:hover{ transform: translateY(-1px); }
    .toggle-all .chev-icon{
      font-size:14px; line-height:1; display:inline-block;
      transition: transform .2s ease;
    }
    .toggle-all.is-collapsed .chev-icon{ transform: rotate(-90deg); }
    @media (max-width: 860px){
      .toggle-all{ display:inline-flex; }
    }
    .big{
      font-size:54px; font-weight:1000; letter-spacing:-0.03em; line-height:1;
      text-shadow: 0 2px 12px rgba(0,0,0,.45);
    }
    .unit{
      font-size:14px; font-weight:900; color:rgba(255,255,255,.7);
      margin-left:8px; text-transform:uppercase; letter-spacing:.06em;
    }
    .row{
      display:flex; flex-wrap:wrap; gap:14px; margin-top:10px;
    }
    .stat{ flex:1 1 120px; }
    .stat .k{
      font-size:11px; color:rgba(255,255,255,.7); text-transform:uppercase;
      letter-spacing:.06em; font-weight:800;
    }
    .stat .v{ font-size:20px; font-weight:900; }

    .status{
      margin-top:14px; font-weight:950; text-transform:uppercase;
      letter-spacing:.06em; font-size:13px;
      display:flex; align-items:flex-start; gap:10px;
    }
    .dot{
      width:12px; height:12px; border-radius:999px; margin-top:4px;
      background:var(--bad);
      box-shadow: 0 0 0 6px rgba(225,29,72,.30);
      flex:0 0 auto;
    }
    .status.good .dot{
      background:var(--ok);
      box-shadow: 0 0 0 6px rgba(26,127,55,.30);
    }
    .status-sub{
      font-weight:700; color:rgba(255,255,255,.78); margin-top:3px;
      text-transform:none; letter-spacing:0;
    }

    .fineprint{ margin-top:10px; color:rgba(255,255,255,.72); font-size:13px; }

    button{
      appearance:none; border:1px solid var(--stroke); border-radius:14px;
      padding:10px 14px; cursor:pointer;
      background:var(--glass-strong); color:#fff;
      font-weight:900; text-transform:uppercase; letter-spacing:.06em; font-size:12px;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
    }
    button:hover{ transform: translateY(-1px); }
    .btnrow{
      display:flex; gap:10px; flex-wrap:wrap; align-items:center;
      margin-top:6px;
    }

    .pillrow{ display:flex; flex-wrap:wrap; gap:8px; margin-top:10px; }
    .pill-big{
      display:inline-flex; align-items:center; gap:8px;
      padding:8px 12px; border-radius:12px;
      background:var(--glass); border:1px solid var(--stroke); color:#fff;
      backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
      font-weight:800; text-transform:uppercase; letter-spacing:.05em; font-size:11px;
    }
    .pill-big .emoji{ font-size:18px; line-height:1; }
    .pill-big.skill-out-of-range{ background:rgba(225,29,72,.20); border-color:rgba(225,29,72,.5); }
    .pill-big.skill-worked{       background:rgba(245,158,11,.18); border-color:rgba(245,158,11,.5); }
    .pill-big.skill-manageable{   background:rgba(26,127,55,.22); border-color:rgba(26,127,55,.55); }
    .pill-big.skill-marginal{     background:rgba(56,189,248,.16); border-color:rgba(56,189,248,.45); }
    .pill-big.skill-flat{         background:rgba(255,255,255,.10); }
    .pill-big.day-night{          background:rgba(15,23,42,.5); }
    .pill-big.day-dawn,
    .pill-big.day-dusk{           background:rgba(245,158,11,.18); border-color:rgba(245,158,11,.5); }

    .spot-card{
      display:flex; flex-direction:column; gap:8px;
      text-decoration:none; color:inherit;
    }
    .spot-card .spot-name{
      font-family:"Original Surfer", cursive; font-weight:400;
      font-size:22px; line-height:1.1;
    }
    .spot-card .spot-sub{
      font-size:12px; color:rgba(255,255,255,.7);
      text-transform:uppercase; letter-spacing:.06em; font-weight:700;
    }
    .spot-card .spot-note{
      font-size:13px; color:rgba(255,255,255,.78); margin-top:4px;
    }
    .spot-card:hover{ transform: translateY(-2px); transition: transform .15s ease; }

    .windowlist{
      margin-top:10px; display:flex; flex-direction:column; gap:8px;
    }
    .window{
      border:1px solid var(--stroke); border-radius:12px;
      background:rgba(255,255,255,.10);
      padding:10px 12px; display:flex; justify-content:space-between;
      gap:10px; align-items:center;
    }
    .window .when{ font-weight:900; }
    .window .meta{ color:rgba(255,255,255,.7); font-size:13px; }

    .footnote{
      position:fixed; right:14px; bottom:10px; z-index:2;
      font-size:10px; color:rgba(255,255,255,.55); letter-spacing:.04em;
    }
    .footnote a{ color:inherit; }

    #globalDay{
      position:fixed; left:14px; bottom:10px; z-index:2;
      display:inline-flex; align-items:center; gap:8px;
      padding:8px 12px; border-radius:12px;
      background:var(--glass); border:1px solid var(--stroke); color:#fff;
      backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
      font-weight:800; text-transform:uppercase; letter-spacing:.05em; font-size:11px;
      box-shadow: 0 4px 14px rgba(0,0,0,.25);
    }
    #globalDay .emoji{ font-size:18px; line-height:1; }
    #globalDay .sub{
      font-size:10px; font-weight:600; color:rgba(255,255,255,.7);
      text-transform:none; letter-spacing:0; margin-left:6px;
    }
    #globalDay.day-night{ background:rgba(15,23,42,.5); }
    #globalDay.day-dawn, #globalDay.day-dusk{
      background:rgba(245,158,11,.18); border-color:rgba(245,158,11,.5);
    }
  </style>
</head>

<body>
  <!-- Full-screen 3D ocean background -->
  <iframe id="oceanFrame" src="3d-ocean/simulation.html" title="3D ocean background" loading="eager"></iframe>
  <div class="veil"></div>

  <div class="wrap">
    <div class="header">
      <div class="brand">
        <div class="name">
          <svg class="pixel-surfer" viewBox="0 0 22 16" shape-rendering="crispEdges" aria-hidden="true">
            <!-- Wave spray behind (upper-left) -->
            <rect x="0"  y="3" width="2" height="1" fill="#fff"/>
            <rect x="1"  y="4" width="3" height="1" fill="#fff"/>
            <rect x="0"  y="5" width="5" height="1" fill="#e6f1f7"/>
            <rect x="2"  y="6" width="5" height="1" fill="#cfe2ed"/>
            <rect x="3"  y="7" width="4" height="1" fill="#b3d9e8"/>
            <rect x="0"  y="8" width="3" height="1" fill="#7fb3cf"/>
            <rect x="2"  y="9" width="5" height="1" fill="#5b9bbe"/>

            <!-- Hair (back of head + top) -->
            <rect x="11" y="0" width="3" height="1" fill="#1f1a17"/>
            <rect x="10" y="1" width="5" height="1" fill="#1f1a17"/>
            <rect x="10" y="2" width="3" height="1" fill="#1f1a17"/>

            <!-- Face / head (facing right) -->
            <rect x="13" y="2" width="2" height="1" fill="#f5d3a6"/>
            <rect x="12" y="3" width="3" height="1" fill="#f5d3a6"/>
            <rect x="14" y="3" width="1" height="1" fill="#1f1a17"/> <!-- eye/sunglasses hint -->
            <rect x="12" y="4" width="2" height="1" fill="#f5d3a6"/>

            <!-- Back arm (going up-left, balance) -->
            <rect x="9"  y="4" width="3" height="1" fill="#f5d3a6"/>
            <rect x="7"  y="5" width="3" height="1" fill="#f5d3a6"/>

            <!-- Torso (shirtless, tan) -->
            <rect x="11" y="5" width="3" height="1" fill="#f5d3a6"/>
            <rect x="11" y="6" width="3" height="1" fill="#f5d3a6"/>
            <rect x="14" y="5" width="1" height="1" fill="#d9a674"/>  <!-- side shading -->
            <rect x="14" y="6" width="1" height="1" fill="#d9a674"/>

            <!-- Front arm (reaching forward-right) -->
            <rect x="14" y="6" width="3" height="1" fill="#f5d3a6"/>
            <rect x="16" y="7" width="2" height="1" fill="#f5d3a6"/>

            <!-- Shorts (red) -->
            <rect x="10" y="7" width="5" height="1" fill="#d63148"/>
            <rect x="9"  y="8" width="6" height="1" fill="#d63148"/>
            <rect x="14" y="8" width="1" height="1" fill="#9b1f33"/>  <!-- shadow under -->

            <!-- Legs — wide stance, bent knees -->
            <rect x="9"  y="9"  width="2" height="1" fill="#f5d3a6"/>  <!-- back thigh -->
            <rect x="13" y="9"  width="2" height="1" fill="#f5d3a6"/>  <!-- front thigh -->
            <rect x="8"  y="10" width="2" height="1" fill="#f5d3a6"/>  <!-- back calf out -->
            <rect x="14" y="10" width="2" height="1" fill="#f5d3a6"/>  <!-- front calf out -->
            <rect x="7"  y="11" width="2" height="1" fill="#f5d3a6"/>  <!-- back foot -->
            <rect x="15" y="11" width="2" height="1" fill="#f5d3a6"/>  <!-- front foot -->

            <!-- Surfboard -->
            <rect x="5"  y="12" width="14" height="1" fill="#ffffff"/>
            <rect x="6"  y="13" width="12" height="1" fill="#d6dde2"/>

            <!-- Wave breaking under board (right side, splash) -->
            <rect x="18" y="12" width="1" height="1" fill="#cfe2ed"/>
            <rect x="19" y="13" width="2" height="1" fill="#b3d9e8"/>
            <rect x="4"  y="13" width="1" height="1" fill="#e6f1f7"/>
            <rect x="3"  y="14" width="3" height="1" fill="#7fb3cf"/>
            <rect x="17" y="14" width="4" height="1" fill="#5b9bbe"/>
            <rect x="6"  y="15" width="10" height="1" fill="#5b9bbe"/>
          </svg>
          <span>Should We Surf?</span>
        </div>
      </div>
      <div class="header-controls">
        <button id="refreshBtn" type="button">Refresh</button>
      </div>
    </div>

    <div class="grid" id="spotGrid">
      <div class="fineprint" style="grid-column:1/-1;">Loading spots…</div>
    </div>

    <div class="btnrow">
      <div class="fineprint" style="margin-left:auto;">
        Last fetch: <span id="lastFetch">—</span> · Live ocean → <span id="legendVis">syncing…</span>
      </div>
    </div>
  </div>

  <div id="globalDay" title="Daylight">
    <span class="emoji">⌛</span><span>—</span>
  </div>

  <div class="footnote">
    Heights shown as estimated surfable face (offshore swell × period factor).
    3D ocean by <a href="https://github.com/Seth-arc/3D-Ocean" target="_blank" rel="noopener">Seth-arc</a>.
  </div>

  <script>
    const el = (id) => document.getElementById(id);

    /* --------------- 3D ocean control bridge --------------------------------- */
    const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));

    function liveToOceanParams(nowcast, forecast){
      const fc = forecast?.next_window;
      const wvht_ft = (nowcast?.wvht_ft) ?? (fc?.peak_swell_ft) ?? 1.0;
      const dpd_s   = (nowcast?.dpd_s)   ?? (fc?.peak_period_s) ?? 6.0;
      const wind_kt = (nowcast?.wind_speed_kt) ?? (fc?.peak_wind_kt) ?? 5.0;

      // Mappings tuned so each parameter has visible effect:
      // - waveHeight → 'size' uniform (clearly visible). 0.5ft→0.2, 3ft→0.9, 6ft→1.7, 10ft+→2.0
      // - waveSpeed → animation time multiplier. Short period = faster animation.
      //   DPD 4s→2.5, 7s→1.6, 10s→1.0, 14s→0.6.
      // - waveLength → distortion scale (subtle, but adds detail). Kept moderate so
      //   wind dominates the chop knob.
      // - windStrength → wind-driven chop. 0kt→0 (glassy), 15kt→0.6, 25kt+→1.0
      return {
        waveHeight:   clamp(0.18 + wvht_ft * 0.20, 0.1, 2.0),
        waveSpeed:    clamp(3.6 - dpd_s * 0.22,    0.3, 3.0),
        waveLength:   clamp(dpd_s * 3,             10,  80),
        windStrength: clamp(wind_kt / 25,          0.0, 1.0),
      };
    }

    function setOceanParams(params){
      const doc = el('oceanFrame').contentDocument;
      if(!doc) return false;
      let any = false;
      for(const [id, value] of Object.entries(params)){
        const input = doc.getElementById(id);
        if(!input) continue;
        input.value = String(value);
        input.dispatchEvent(new Event('input', { bubbles: true }));
        any = true;
      }
      return any;
    }

    function describeOcean(p){
      return `swell ${p.waveHeight.toFixed(2)} · chop ${p.waveSpeed.toFixed(2)} · λ ${p.waveLength.toFixed(0)} · wind ${p.windStrength.toFixed(2)}`;
    }

    let _lastParams = null;
    function pushOcean(){
      if(!_lastParams) return;
      const ok = setOceanParams(_lastParams);
      if(!ok){ setTimeout(pushOcean, 400); return; }
      el('legendVis').textContent = describeOcean(_lastParams);
    }
    el('oceanFrame').addEventListener('load', () => setTimeout(pushOcean, 200));
    /* ------------------------------------------------------------------------- */

    function fmtTime(d){
      try { return d.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'}); }
      catch { return d.toISOString(); }
    }

    const SPOTS = [
      { slug: 'ocean-mist',   name: 'Ocean Mist',        sub: 'Matunuck, RI' },
      { slug: 'narragansett', name: 'Narragansett',      sub: 'Town Beach, RI' },
      { slug: 'sachuest',     name: 'Second Beach',      sub: 'Sachuest · Middletown' },
      { slug: 'long-sands',   name: 'Long Sands Beach',  sub: 'York, ME' },
      { slug: 'hampton',      name: 'Hampton Beach',     sub: 'Hampton, NH' },
      { slug: 'nauset',       name: 'Nauset Beach',      sub: 'Orleans, MA' },
      { slug: 'long-beach',   name: 'Long Beach',        sub: 'Long Island, NY' },
      { slug: 'rockaway',     name: 'Rockaway Beach',    sub: 'Queens, NY' },
      { slug: 'manasquan',    name: 'Manasquan',         sub: 'Manasquan, NJ' },
      { slug: 'popham',       name: 'Popham Beach',      sub: 'Phippsburg, ME' },
    ];

    function renderSpotCard(spot, data){
      const card = document.createElement('a');
      card.className = 'card spot-card';
      card.href = `spots/${spot.slug}/`;
      card.dataset.card = spot.slug;

      if(!data){
        card.innerHTML = `
          <div class="spot-name">${spot.name}</div>
          <div class="spot-sub">${spot.sub}</div>
          <div class="fineprint">No data yet.</div>`;
        return card;
      }

      const n = data.now || {};
      const sk = n.skill || null;
      const face = n.face_ft;
      const period = n.period_s;
      const swell = n.swell_ft;
      const wind = n.wind_speed_kt;
      const windDir = n.wind_dir || '';
      const sp = data.spot || {};

      const skillPill = sk ? `<div class="pill-big skill-${sk.level}">
        <span class="emoji">${sk.emoji}</span><span>${sk.label}</span></div>` : '';

      card.innerHTML = `
        <div class="spot-name">${sp.name || spot.name}</div>
        <div class="spot-sub">${sp.subtitle || spot.sub}</div>
        <div style="margin-top:8px;">
          <span class="big">${face ?? '—'}</span><span class="unit">ft face</span>
          <span style="margin-left:12px; font-size:20px; font-weight:900;">${period ?? '—'} s</span>
        </div>
        <div class="row">
          <div class="stat"><div class="k">Swell</div><div class="v">${swell ?? '—'} ft</div></div>
          <div class="stat"><div class="k">Wind</div><div class="v">${wind ?? '—'} kt ${windDir}</div></div>
        </div>
        <div class="pillrow">${skillPill}</div>
        ${sk && sk.note ? `<div class="spot-note">${sk.note}</div>` : ''}`;
      return card;
    }

    async function loadSpot(slug){
      try {
        const res = await fetch(`spots/${slug}.json?ts=${Date.now()}`, { cache: 'no-store' });
        if(!res.ok) throw new Error(`${slug}.json ${res.status}`);
        return await res.json();
      } catch(err){
        console.error(slug, err);
        return null;
      }
    }

    async function load(){
      el('refreshBtn').disabled = true;
      el('refreshBtn').textContent = 'Refreshing…';
      try {
        const results = await Promise.all(SPOTS.map(s => loadSpot(s.slug)));
        const grid = el('spotGrid');
        grid.innerHTML = '';
        for(let i=0; i<SPOTS.length; i++){
          grid.appendChild(renderSpotCard(SPOTS[i], results[i]));
        }

        const primary = results[0];
        if(primary){
          el('lastFetch').textContent = fmtTime(new Date(primary.fetched_at));
          const n = primary.now;
          if(n){
            _lastParams = liveToOceanParams(
              { wvht_ft: n.swell_ft, dpd_s: n.period_s, wind_speed_kt: n.wind_speed_kt },
              primary.forecast,
            );
            pushOcean();
          }
          const dl = primary.daylight;
          if(dl){
            const g = el('globalDay');
            g.className = 'day-' + dl.status;
            const sub = dl.sunrise_local && dl.sunset_local
              ? `<span class="sub">↑${dl.sunrise_local} ↓${dl.sunset_local}</span>` : '';
            g.innerHTML = `<span class="emoji">${dl.emoji}</span><span>${dl.label}</span>${sub}`;
            g.title = dl.note || '';
          }
        }
      } catch (err) {
        console.error(err);
      } finally {
        el('refreshBtn').disabled = false;
        el('refreshBtn').textContent = 'Refresh';
      }
    }

    el('refreshBtn').addEventListener('click', load);
    window.addEventListener('load', load);
    document.addEventListener('visibilitychange', () => {
      if(document.visibilityState === 'visible') load();
    });

  </script>
</body>
</html>
